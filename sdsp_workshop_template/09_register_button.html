<!-- 09_register_button.html
     ============================================================
     The primary "Register Here" CTA button. Includes Outlook VML
     so the button renders correctly in Outlook for Windows.

     FILL IN:
       {{REGISTRATION_URL}} — Registration page URL.
                              IMPORTANT: this placeholder appears 2x in
                              this file. Use Find & Replace to swap both
                              at once.
     ============================================================ -->
<table width="100%" border="0" cellpadding="10" cellspacing="0" role="presentation">
  <tr>
    <td align="center">
      <a href="{{REGISTRATION_URL}}" target="_blank" style="color: #ffffff; text-decoration: none;">
        <!--[if mso]>
        <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word" href="{{REGISTRATION_URL}}" style="height:42px;width:138px;v-text-anchor:middle;" arcsize="10%" fillcolor="#3aaee0">
        <v:stroke dashstyle="Solid" weight="0px" color="#3aaee0"/>
        <w:anchorlock/>
        <v:textbox inset="0px,0px,0px,0px">
        <center dir="false" style="color:#ffffff;font-family:sans-serif;font-size:16px">
        <![endif]-->
        <span style="background-color: #3aaee0; border-radius: 4px; color: #ffffff; display: inline-block; font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 400; text-align: center;">
          <span style="display: block; padding: 5px 20px;">
            <span style="line-height: 32px;">Register Here</span>
          </span>
        </span>
        <!--[if mso]></center></v:textbox></v:roundrect><![endif]-->
      </a>
    </td>
  </tr>
</table>
