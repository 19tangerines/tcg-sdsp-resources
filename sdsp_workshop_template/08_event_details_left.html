<!-- 08_event_details_left.html
     ============================================================
     The left column of the 2-column Event Details row.
     The right column should be a native Image block (workshop
     topic image, ~250px wide).

     FILL IN:
       {{DATE}}     — e.g. "June 17, 2026"
       {{TIME}}     — e.g. "9:00 AM - 3:30 PM"
       {{LOCATION}} — e.g. "UC San Diego (in-person)"
       {{AUDIENCE}} — e.g. "Grades 7-12 Science Teachers and Teacher Leaders"
       {{COST}}     — e.g. "$50 Registration Fee (includes parking and materials)"
     ============================================================ -->
<table width="100%" border="0" cellpadding="10" cellspacing="0" role="presentation">
  <tr>
    <td>
      <div style="color: #444a5b; font-family: Arial, Helvetica, sans-serif; font-size: 16px; line-height: 1.5; text-align: left;">
        <p style="margin: 0 0 16px 0;"><strong>Date:</strong> {{DATE}}</p>
        <p style="margin: 0 0 16px 0;"><strong>Time:</strong> {{TIME}}</p>
        <p style="margin: 0 0 16px 0;"><strong>Location:</strong> {{LOCATION}}</p>
        <p style="margin: 0 0 16px 0;"><strong>Audience:</strong> {{AUDIENCE}}</p>
        <p style="margin: 0;"><strong>Cost:</strong> {{COST}}</p>
      </div>
    </td>
  </tr>
</table>
