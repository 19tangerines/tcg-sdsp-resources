<!-- 04_event_card_left.html
     ============================================================
     Event card — LEFT orientation (text on left, image on right).
     Goes in the LEFT column of a 2-column row. The RIGHT column
     should be a native Image block (event-related image, ~250px).

     Use this for events #1 and #3 (if you have 3 events total).
     For event #2 use 05_event_card_right.html instead.

     MAX 3 EVENT CARDS TOTAL — see README for alternation pattern.

     FILL IN:
       {{EVENT_TITLE}}      — Workshop / event name, e.g.
                              "Science Media Literacy Workshop"
       {{EVENT_BLURB}}      — ~30 word description.
                              Example: "Students encounter science claims
                              online all the time. This hands-on workshop
                              helps you integrate evaluating science claims
                              into any science course!"
       {{EVENT_DATE}}       — Date string, e.g. "June 17th" or
                              "June 9th, June 10th" for multi-day
       {{MORE_DETAILS_URL}} — Link to the event's details / registration page.
                              IMPORTANT: appears 2x in this file — use
                              Find & Replace.
     ============================================================ -->
<table width="100%" border="0" cellpadding="10" cellspacing="0" role="presentation">
  <tr>
    <td>
      <div style="color: #444a5b; font-family: Arial, Helvetica, sans-serif; font-size: 16px; line-height: 1.5; text-align: left;">
        <p style="margin: 0 0 12px 0;"><strong>{{EVENT_TITLE}}</strong></p>
        <p style="margin: 0 0 12px 0;">{{EVENT_BLURB}}</p>
        <p style="margin: 0;"><strong>{{EVENT_DATE}}</strong></p>
      </div>
    </td>
  </tr>
  <tr>
    <td align="center" style="padding: 10px;">
      <a href="{{MORE_DETAILS_URL}}" target="_blank" style="color: #ffffff; text-decoration: none;">
        <!--[if mso]>
        <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word" href="{{MORE_DETAILS_URL}}" style="height:42px;width:129px;v-text-anchor:middle;" arcsize="10%" fillcolor="#3aaee0">
        <v:stroke dashstyle="Solid" weight="0px" color="#3aaee0"/>
        <w:anchorlock/>
        <v:textbox inset="0px,0px,0px,0px">
        <center dir="false" style="color:#ffffff;font-family:sans-serif;font-size:16px">
        <![endif]-->
        <span style="background-color: #3aaee0; border-radius: 4px; color: #ffffff; display: inline-block; font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 400; text-align: center;">
          <span style="display: block; padding: 5px 20px;">
            <span style="line-height: 32px;">More Details</span>
          </span>
        </span>
        <!--[if mso]></center></v:textbox></v:roundrect><![endif]-->
      </a>
    </td>
  </tr>
</table>
